<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagaraku</title>
    <link rel="icon" href="Nagaraku.jpg">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<div class="app-container">
    <div id="login-screen" class="overlay-screen">
        <div class="overlay-card">
            <div class="overlay-title">Nagaraku</div>
            <button id="main-login-btn">Googleでログイン</button>
        </div>
    </div>

    <div id="setup-screen" class="overlay-screen">
        <div class="overlay-card">
            <div class="overlay-title">初期設定</div>
            <div class="form-group"><label>ニックネーム</label><input type="text" id="setup-nickname"></div>
            <div class="form-group"><label>学年</label><select id="setup-grade"><option value="1">1年</option><option value="2">2年</option></select></div>
            <div class="form-group"><label>組</label><select id="setup-class"><option value="1">1組</option><option value="2">2組</option><option value="3">3組</option><option value="4">4組</option><option value="5">5組</option><option value="6">6組</option></select></div>
            <div class="form-group"><label>出席番号</label><input type="number" id="setup-number"></div>
            <button id="setup-save-btn">はじめる</button>
        </div>
    </div>

    <header>
        <div class="header-content-wrapper">
            <div class="header-main-row">
                <div class="header-logo-title">
                    <img src="Nagaraku.jpg" alt="Logo" style="height:35px; width:auto; border-radius:50%;">
                    <span id="header-title">今日の時間割</span>
                </div>
            </div>
            <div class="header-user-container" id="header-user-container">
                <div id="user-popup"><div id="popup-info" style="font-weight:800;"></div></div>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div id="tab-schedule" class="tab-content active">
            <div class="day-selector">
                <button id="prev-day-btn">◀</button>
                <span id="current-day-label">月曜日</span>
                <button id="next-day-btn">▶</button>
            </div>
            <div id="schedule-list"></div>
        </div>
        <div id="tab-tasks" class="tab-content">
            <div class="card todo-form-card"><input type="text" id="todo-input"><button id="todo-add-btn">追加</button></div>
            <div id="todo-list"></div>
        </div>
        <div id="tab-account" class="tab-content">
            <div class="card profile-card">
                <span id="account-name"></span>
                <button id="logout-btn">ログアウト</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn active" data-tab="schedule" data-title="今日の時間割">時間割</button>
        <button class="nav-btn" data-tab="tasks" data-title="課題・Todo">タスク</button>
        <button class="nav-btn" data-tab="account" data-title="設定">設定</button>
    </nav>
</div>
<script src="script.js" type="module"></script>
</body>
</html>
