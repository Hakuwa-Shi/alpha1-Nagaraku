<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクール・アシスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header id="header-title">今日の時間割</header>

    <main>
        <div id="tab-schedule" class="tab-content active">
            <div class="card">
                <div class="card-title">1限 (8:50 - 9:40)</div>
                <div class="card-main">現代文 📖</div>
            </div>
            <div class="card">
                <div class="card-title">2限 (9:50 - 10:40)</div>
                <div class="card-main">数学II 📐</div>
            </div>
            <div class="card">
                <div class="card-title">3限 (10:50 - 11:40)</div>
                <div class="card-main">英語 🗣️</div>
            </div>
            <div class="card">
                <div class="card-title">4限 (11:50 - 12:40)</div>
                <div class="card-main">物理 ⚡</div>
            </div>
        </div>

        <div id="tab-tasks" class="tab-content">
            <h3 class="section-title">未完了のタスク</h3>
            
            <div class="card todo-form-card">
                <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
                <button id="todo-add-btn">追加</button>
            </div>
        
            <div id="todo-list">
                </div>
        </div>
        
        <div id="tab-account" class="tab-content">
            <div class="card profile-card">
                <div class="profile-icon">👤</div>
                <div class="card-main" id="account-name">ゲストユーザー</div>
                <p id="account-status">Classroomと連携するにはログインしてください。</p>
                <button id="login-btn">Googleでログイン</button>
            </div>

            <div class="card" id="profile-settings" style="display: none;">
                <h3 class="section-title">クラス情報の設定</h3>
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" id="profile-nickname" placeholder="例: 塩谷">
                </div>
                <div class="form-group">
                    <label>学年</label>
                    <select id="profile-grade">
                        <option value="1">1年</option>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>組</label>
                    <input type="number" id="profile-class" placeholder="例: 3" min="1">
                </div>
                <div class="form-group">
                    <label>出席番号</label>
                    <input type="number" id="profile-number" placeholder="例: 15" min="1">
                </div>
                <button id="profile-save-btn">保存する</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('schedule', '今日の時間割', this)">
            <span class="nav-icon">📅</span>
            <span>時間割</span>
        </button>
        <button class="nav-btn" onclick="switchTab('tasks', '課題・Todo', this)">
            <span class="nav-icon">✓</span>
            <span>タスク</span>
        </button>
        <button class="nav-btn" onclick="switchTab('account', 'アカウント', this)">
            <span class="nav-icon">👤</span>
            <span>設定</span>
        </button>
    </nav>
</div>

    <script src="script.js" type="module"></script>
</body>
</html>
