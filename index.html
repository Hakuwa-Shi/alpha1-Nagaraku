<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagaraku</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 強制ログイン・初期設定画面用のスタイル */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 1000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .overlay-card {
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .overlay-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .overlay-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 25px;
        }
        #login-screen, #setup-screen {
            display: none; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="login-screen" class="overlay-screen">
        <div class="overlay-card">
            <div class="overlay-title">Nagaraku</div>
            <div class="overlay-desc">Nagarakuを利用するには、<br>学校のGoogleアカウントでログインしてください。</div>
            <button id="main-login-btn" style="background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1.1rem; width: 100%; cursor: pointer; font-weight: bold;">Googleでログイン</button>
        </div>
    </div>

    <div id="setup-screen" class="overlay-screen">
        <div class="overlay-card">
            <div class="overlay-title">初期設定</div>
            <div class="overlay-desc">まずはあなたのクラス情報を<br>登録しましょう。</div>
            
            <div style="text-align: left;">
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" id="setup-nickname" placeholder="例: 塩谷">
                </div>
                <div class="form-group">
                    <label>学年</label>
                    <select id="setup-grade">
                        <option value="1">1年</option>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>組</label>
                    <select id="setup-class">
                        <option value="1">1組</option>
                        <option value="2">2組</option>
                        <option value="3">3組</option>
                        <option value="4">4組</option>
                        <option value="5">5組</option>
                        <option value="6">6組</option>
                        <option value="7">7組</option>
                        <option value="8">8組</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出席番号</label>
                    <input type="number" id="setup-number" placeholder="例: 15" min="1">
                </div>
                <button id="setup-save-btn" style="background-color: #6bb374; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1.1rem; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px;">はじめる</button>
            </div>
        </div>
    </div>

    <header>
        <span id="header-title">今日の時間割</span>
        <div class="header-user-container" id="header-user-container" style="display: none;">
            <button id="header-user-btn" class="header-user-btn" aria-label="ユーザーメニュー">
                <svg class="icon-svg" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
                </svg>
            </button>
            <div id="user-popup" class="user-popup">
                <div id="popup-email" class="popup-email">loading...</div>
                <div id="popup-info" class="popup-info"></div>
            </div>
        </div>
    </header>

    <main id="main-content" style="display: none;"> 
        <div id="tab-schedule" class="tab-content active">
            <div class="day-selector">
                <button id="prev-day-btn" class="day-btn">◀</button>
                <span id="current-day-label">月曜日</span>
                <button id="next-day-btn" class="day-btn">▶</button>
            </div>
            
            <div id="schedule-list">
                <p style="text-align:center; color:#888; padding:20px;">時間割を読み込み中...</p>
            </div>
        </div>

        <div id="tab-tasks" class="tab-content">
            <h3 class="section-title">未完了のタスク</h3>
            
            <div class="card todo-form-card">
                <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
                <button id="todo-add-btn">追加</button>
            </div>
        
            <div id="todo-list"></div>
        </div>
        
        <div id="tab-account" class="tab-content">
            <div class="card profile-card">
                <div class="profile-icon-container">
                    <svg class="profile-main-svg" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
                    </svg>
                </div>
                
                <div class="card-main">
                    <span id="account-name">ゲストユーザー</span>
                    <span id="developer-badge" class="dev-badge" style="display: none;">開発者</span>
                </div>
                
                <p id="account-profile-info" style="color: #666; font-size: 0.9rem; margin-top: 5px; font-weight: bold;"></p>
                <p id="account-status">Classroomと連携するにはログインしてください。</p>
                <button id="logout-btn" style="background-color: var(--danger-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold;">ログアウト</button>
            </div>

            <div class="card" id="profile-settings">
                <h3 class="section-title">クラス情報の設定</h3>
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" id="profile-nickname" placeholder="例: 塩谷">
                </div>
                <div class="form-group">
                    <label>学年</label>
                    <select id="profile-grade">
                        <option value="1">1年</option>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>組</label>
                    <select id="profile-class">
                        <option value="1">1組</option>
                        <option value="2">2組</option>
                        <option value="3">3組</option>
                        <option value="4">4組</option>
                        <option value="5">5組</option>
                        <option value="6">6組</option>
                        <option value="7">7組</option>
                        <option value="8">8組</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出席番号</label>
                    <input type="number" id="profile-number" placeholder="例: 15" min="1">
                </div>
                <button id="profile-save-btn">保存する</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" style="display: none;"> 
        <button class="nav-btn active" onclick="switchTab('schedule', '今日の時間割', this)">
            <svg
