<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagaraku</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        /* 強制ログイン・初期設定画面用のスタイル */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 1000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .overlay-card {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
        }
        .overlay-title {
            font-size: 1.6rem;
            color: #334e68;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .overlay-desc {
            font-size: 0.9rem;
            color: #627d98;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        #login-screen, #setup-screen {
            display: none; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="login-screen" class="overlay-screen">
        <div class="overlay-card">
            <div style="font-size: 3rem; margin-bottom: 15px; background: linear-gradient(135deg, #48cae4, #00b4d8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;">N</div>
            <div class="overlay-title">Nagaraku</div>
            <div class="overlay-desc">利用するには、学校の<br>Googleアカウントでログインしてください。</div>
            <button id="main-login-btn" style="background: linear-gradient(135deg, #4ea8de, #56cfe1); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 1.05rem; width: 100%; cursor: pointer; font-weight: bold; box-shadow: 0 4px 12px rgba(78, 168, 222, 0.3);">Googleでログイン</button>
        </div>
    </div>

    <div id="setup-screen" class="overlay-screen">
        <div class="overlay-card">
            <div class="overlay-title">初期設定</div>
            <div class="overlay-desc">まずはあなたのクラス情報を<br>登録しましょう。</div>
            
            <div style="text-align: left;">
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" id="setup-nickname" placeholder="例: 塩谷">
                </div>
                <div class="form-group">
                    <label>学年</label>
                    <select id="setup-grade">
                        <option value="1">1年</option>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>組</label>
                    <select id="setup-class">
                        <option value="1">1組</option>
                        <option value="2">2組</option>
                        <option value="3">3組</option>
                        <option value="4">4組</option>
                        <option value="5">5組</option>
                        <option value="6">6組</option>
                        <option value="7">7組</option>
                        <option value="8">8組</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出席番号</label>
                    <input type="number" id="setup-number" placeholder="例: 15" min="1">
                </div>
                <button id="setup-save-btn" style="background: linear-gradient(135deg, #56cfe1, #72efdd); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 1.05rem; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 12px rgba(86, 207, 225, 0.3);">はじめる</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-content-wrapper">
            <div class="header-logo-title">
                <span class="header-logo-badge">N</span>
                <span id="header-title">今日の時間割</span>
            </div>
            <div class="header-user-container" id="header-user-container">
                <button id="header-user-btn" class="header-user-btn" aria-label="ユーザーメニュー" style="display: none;">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
                </button>
                <div id="user-popup" class="user-popup">
                    <div id="popup-email" class="popup-email"></div>
                    <div id="popup-info" class="popup-info"></div>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" style="display: none;"> 
        
        <div id="tab-schedule" class="tab-content active">
            <div class="day-selector">
                <button id="prev-day-btn" class="day-btn">◀</button>
                <span id="current-day-label">月曜日</span>
                <button id="next-day-btn" class="day-btn">▶</button>
            </div>
            <div id="schedule-list">
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 2rem; margin-bottom: 5px; background: linear-gradient(135deg, #48cae4, #00b4d8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; animation: pulse 1.5s infinite alternate;">N</div>
                    <p style="color:#888; margin: 0; font-size: 0.85rem;">時間割を読み込み中...</p>
                </div>
            </div>
        </div>

        <div id="tab-tasks" class="tab-content">
            <h3 class="section-title">未完了のタスク</h3>
            <div class="card todo-form-card">
                <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
                <button id="todo-add-btn">追加</button>
            </div>
            <div id="todo-list"></div>
        </div>
        
        <div id="tab-account" class="tab-content">
            <div class="card profile-card">
                <div class="profile-icon-container" style="margin-bottom: 10px; display: flex; justify-content: center;">
                    <svg class="profile-main-svg" viewBox="0 0 24 24" style="width: 48px; height: 48px; fill: #00b4d8;">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
                    </svg>
                </div>
                <div class="account-name-wrapper">
                    <span id="account-name">ゲストユーザー</span>
                    <span id="developer-badge" class="dev-badge" style="display: none;">◆ 開発者</span>
                </div>
                
                <p id="account-profile-info" style="color: #627d98; font-size: 0.9rem; margin-top: 5px; font-weight: 700;"></p>
                <p id="account-status">Classroomと連携するにはログインしてください。</p>
                <button id="logout-btn" style="background-color: var(--danger-color); color: white; border: none; padding: 11px 20px; border-radius: 10px; font-size: 0.95rem; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold;">ログアウト</button>
            </div>

            <div class="card bug-report-card">
                <h3 class="section-title" style="margin-bottom: 6px;">🛠️ トラブルシューティング</h3>
                <p style="font-size: 0.8rem; color: #627d98; margin-bottom: 12px; line-height: 1.4;">
                    アプリの動作に不備やエラーが発生した場合は、ここから開発者へ状況を直接メール報告できます。
                </p>
                <div class="form-group">
                    <label>エラー内容・不具合の状況</label>
                    <textarea id="bug-text" rows="4" placeholder="例：時間割が表示されない、特定のボタンが反応しないなど" style="width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; resize: vertical; font-family: inherit; background-color: #f8f9fa;"></textarea>
                </div>
                <button id="send-bug-btn" style="background: linear-gradient(135deg, #4ea8de, #64dfdf); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 0.95rem; width: 100%; cursor: pointer; font-weight: bold;">報告メールを作成する</button>
            </div>

            <div class="card" id="profile-settings">
                <h3 class="section-title">クラス情報の設定</h3>
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" id="profile-nickname" placeholder="例: 塩谷">
                </div>
                <div class="form-group">
                    <label>学年</label>
                    <select id="profile-grade">
                        <option value="1">1年</option>
                        <option value="2">2年</option>
                        <option value="3">3年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>組</label>
                    <select id="profile-class">
                        <option value="1">1組</option>
                        <option value="2">2組</option>
                        <option value="3">3組</option>
                        <option value="4">4組</option>
                        <option value="5">5組</option>
                        <option value="6">6組</option>
                        <option value="7">7組</option>
                        <option value="8">8組</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出席番号</label>
                    <input type="number" id="profile-number" placeholder="例: 15" min="1">
                </div>
                <button id="profile-save-btn">保存する</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" style="display: none;"> 
        <button class="nav-btn active" onclick="switchTab('schedule', '今日の時間割', this)">
            <svg class="nav-svg" viewBox="0 0 24 24">
                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
            </svg>
            <span class="nav-text">時間割</span>
        </button>
        <button class="nav-btn" onclick="switchTab('tasks', '課題・Todo', this)">
            <svg class="nav-svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span class="nav-text">タスク</span>
        </button>
        <button class="nav-btn" onclick="switchTab('account', '設定・アカウント', this)">
            <svg class="nav-svg" viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            <span class="nav-text">設定</span>
        </button>
    </nav>
</div>

    <script>
        // script.jsの読み込み完了後にヘッダーテキストをニックネームに書き換える監視処理
        const observer = new MutationObserver(() => {
            const container = document.getElementById('header-user-container');
            const nicknameInput = document.getElementById('profile-nickname');
            const gradeSelect = document.getElementById('profile-grade');
            const classSelect = document.getElementById('profile-class');
            const numberInput = document.getElementById('profile-number');
            
            if (container && nicknameInput && nicknameInput.value) {
                const name = nicknameInput.value;
                const grade = gradeSelect.value || "2";
                const cls = classSelect.value || "6";
                const num = numberInput.value || "16";
                // 内部をニックネームとクラス情報の太字に書き換え
                container.innerHTML = `<span style="font-weight: 800; color: white;">${name}さん<br>${grade}年${cls}組 ${num}番</span>`;
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <script src="script.js" type="module"></script>
</body>
</html>
